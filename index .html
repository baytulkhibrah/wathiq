<title>وثّق Wathiq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* ===== الرموز اللونية: الوضع الفاتح هو الأساس ===== */
:root{
  /* لوحة ألوان هاكاثون جامعة الطائف: بنفسجي + برتقالي + تركوازي على أرضية دافئة فاتحة */
  --ground:#F5F3EF; --surface:#FFFFFF; --surface-2:#FAF8F4; --surface-3:#EEEAE2;
  --line:#E4DED4; --line-strong:#CEC6B9;
  --ink:#2B2740; --ink-2:#4B4560; --ink-muted:#837A71;
  --navy:#4A3F82; --navy-deep:#332B5C; --navy-soft:#EDEAF7;
  --accent:#55488F;
  --teal:#2E8098; --teal-ink:#1E6478; --teal-soft:#E4F1F5;
  --amber:#A2681B; --amber-soft:#FBEEDC;
  --red:#B23A2E; --red-soft:#FBE9E6;
  --btn-fg:#FFFFFF;
  --shadow-s:0 1px 2px rgba(51,43,92,.06), 0 2px 8px rgba(51,43,92,.05);
  --shadow-m:0 2px 6px rgba(51,43,92,.08), 0 12px 28px rgba(51,43,92,.12);
  --r-s:8px; --r-m:12px; --r-l:18px; --r-pill:999px;
  --sans:"Tajawal","Segoe UI",system-ui,sans-serif;
  --display:"IBM Plex Sans Arabic","Tajawal","Segoe UI",system-ui,sans-serif;
}
:root:not([data-theme="light"]) { color-scheme: light; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#151327; --surface:#1E1B33; --surface-2:#262242; --surface-3:#332D53;
    --line:#38325A; --line-strong:#4B4479;
    --ink:#EFECF8; --ink-2:#CEC8E4; --ink-muted:#A79EBC;
    --navy:#6E60B8; --navy-deep:#100D1E; --navy-soft:#2A2449;
    --accent:#B0A2EC;
    --teal:#4FB2CB; --teal-ink:#93D6E6; --teal-soft:#123742;
    --amber:#DFA965; --amber-soft:#3B2A14;
    --red:#F08276; --red-soft:#3C1D19;
    --btn-fg:#FFFFFF;
    --shadow-s:0 1px 2px rgba(0,0,0,.4);
    --shadow-m:0 8px 26px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ground:#151327; --surface:#1E1B33; --surface-2:#262242; --surface-3:#332D53;
  --line:#38325A; --line-strong:#4B4479;
  --ink:#EFECF8; --ink-2:#CEC8E4; --ink-muted:#A79EBC;
  --navy:#6E60B8; --navy-deep:#100D1E; --navy-soft:#2A2449;
  --accent:#B0A2EC;
  --teal:#4FB2CB; --teal-ink:#93D6E6; --teal-soft:#123742;
  --amber:#DFA965; --amber-soft:#3B2A14;
  --red:#F08276; --red-soft:#3C1D19;
  --btn-fg:#FFFFFF;
  --shadow-s:0 1px 2px rgba(0,0,0,.4);
  --shadow-m:0 8px 26px rgba(0,0,0,.5);
  color-scheme: dark;
}

*{box-sizing:border-box}
body{
  margin:0; direction:rtl; text-align:right;
  background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--display); margin:0; line-height:1.35; text-wrap:balance; font-weight:700; color:var(--ink)}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.05rem} h4{font-size:.95rem}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important; transition-duration:.01ms !important}}

/* ===== شريط التنبيه الثابت ===== */
.demobar{
  position:sticky; top:0; z-index:60;
  background:var(--amber-soft); color:var(--amber);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:10px; justify-content:center;
  padding:7px 16px; font-size:.82rem; font-weight:700; text-align:center;
}
.demobar svg{flex:0 0 auto}

/* ===== الهيكل ===== */
.app{display:grid; grid-template-columns:264px minmax(0,1fr); min-height:calc(100vh - 34px)}
.sidebar{
  background:var(--surface); border-inline-start:1px solid var(--line);
  padding:18px 14px; display:flex; flex-direction:column; gap:6px;
  position:sticky; top:34px; height:calc(100vh - 34px); overflow:auto;
}
.brandbox{display:flex; align-items:center; gap:10px; padding:6px 8px 14px}
.logomark{
  width:40px;height:40px;border-radius:11px;background:var(--navy);
  display:grid;place-items:center;flex:0 0 auto;box-shadow:var(--shadow-s)
}
.brandname{font-family:var(--display); font-weight:700; font-size:1.15rem; letter-spacing:-.2px}
.brandsub{font-size:.7rem; color:var(--ink-muted); font-weight:500; letter-spacing:.06em}
.navbtn{
  display:flex; align-items:center; gap:10px; width:100%;
  background:transparent; border:1px solid transparent; border-radius:var(--r-m);
  padding:9px 11px; color:var(--ink-2); font-size:.92rem; font-weight:500; text-align:right;
}
.navbtn:hover{background:var(--surface-2); color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--navy-soft); color:var(--navy); font-weight:700; border-color:var(--line)}
:root[data-theme="dark"] .navbtn[aria-current="page"],
:root:not([data-theme="light"]) .navbtn[aria-current="page"]{color:var(--accent)}
.navbtn .ico{flex:0 0 auto; opacity:.9}
.navsep{height:1px;background:var(--line);margin:10px 4px}
.cta-new{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--navy); color:var(--btn-fg); border:0; border-radius:var(--r-m);
  padding:12px; font-weight:700; font-size:.95rem; box-shadow:var(--shadow-s); margin-bottom:6px;
}
.cta-new:hover{filter:brightness(1.08)}
.sidefoot{margin-top:auto; padding-top:12px; font-size:.75rem; color:var(--ink-muted)}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  display:flex; align-items:center; gap:12px; justify-content:space-between;
  padding:14px 26px; border-bottom:1px solid var(--line); background:var(--surface);
  position:sticky; top:34px; z-index:40;
}
.topbar .who{display:flex; align-items:center; gap:10px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--teal-soft);color:var(--teal-ink);
  display:grid;place-items:center;font-weight:700;font-family:var(--display);flex:0 0 auto}
.page{padding:26px; max-width:1180px; width:100%}
.pagehead{margin-bottom:20px}
.pagehead .eyebrow{font-size:.75rem;letter-spacing:.12em;color:var(--ink-muted);font-weight:700}
.pagehead p.lede{color:var(--ink-muted); font-size:.93rem; margin-top:4px; max-width:70ch}

/* ===== عناصر عامة ===== */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); box-shadow:var(--shadow-s)}
.pad{padding:18px}
.grid{display:grid; grid-template-columns:minmax(0,1fr); gap:16px}
.grid>*, .stats>*, .charts>*, .tpl-grid>*, .review>*, .rec-layout>*{min-width:0}
.card{min-width:0}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.spacer{flex:1}
.btn{
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink);
  border-radius:var(--r-m); padding:10px 16px; font-weight:600; font-size:.9rem;
  display:inline-flex; align-items:center; gap:8px;
}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--navy); color:var(--btn-fg); border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.teal{background:var(--teal); color:#fff; border-color:transparent}
.btn.teal:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--accent)}
.btn.danger{color:var(--red); border-color:var(--red)}
.btn.lg{padding:13px 22px; font-size:1rem}
.btn:disabled{opacity:.45; cursor:not-allowed}
.chip{
  display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-pill);
  padding:3px 11px; font-size:.76rem; font-weight:700; border:1px solid transparent;
}
.chip.demo{background:var(--amber-soft); color:var(--amber)}
.chip.ok{background:var(--teal-soft); color:var(--teal-ink)}
.chip.warn{background:var(--amber-soft); color:var(--amber)}
.chip.bad{background:var(--red-soft); color:var(--red)}
.chip.neutral{background:var(--surface-3); color:var(--ink-2)}
.label{font-size:.78rem;font-weight:700;color:var(--ink-muted);letter-spacing:.02em}
.muted{color:var(--ink-muted)}
.small{font-size:.82rem}
.hint{font-size:.82rem;color:var(--ink-muted)}
input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{
  width:100%; background:var(--surface); border:1px solid var(--line-strong);
  border-radius:var(--r-m); padding:10px 12px; font-size:.93rem; color:var(--ink);
}
textarea{resize:vertical; line-height:1.8}
input::placeholder,textarea::placeholder{color:var(--ink-muted); opacity:.75}
.field{display:flex;flex-direction:column;gap:6px}
.notice{
  display:flex; gap:10px; align-items:flex-start; border-radius:var(--r-m);
  padding:11px 13px; font-size:.86rem; line-height:1.6; border:1px solid transparent;
}
.notice.amber{background:var(--amber-soft); color:var(--amber); border-color:color-mix(in srgb, var(--amber) 25%, transparent)}
.notice.blue{background:var(--navy-soft); color:var(--navy); border-color:var(--line)}
:root[data-theme="dark"] .notice.blue, :root:not([data-theme="light"]) .notice.blue{color:var(--ink-2)}
.notice.red{background:var(--red-soft); color:var(--red); border-color:color-mix(in srgb, var(--red) 25%, transparent)}
.notice.teal{background:var(--teal-soft); color:var(--teal-ink); border-color:color-mix(in srgb, var(--teal) 25%, transparent)}
.notice svg{flex:0 0 auto; margin-top:2px}

/* ===== تسجيل الدخول ===== */
.login{min-height:calc(100vh - 34px); display:grid; grid-template-columns:1.05fr .95fr}
.login-art{
  background:var(--navy-deep); color:#fff; padding:44px; display:flex; flex-direction:column; justify-content:center; gap:22px;
  position:relative; overflow:hidden;
}
.login-art h1{color:#fff; font-size:2.6rem; letter-spacing:-.5px}
.login-art .tagline{font-family:var(--display); font-size:1.5rem; color:#7FC6D8; font-weight:600}
.login-art p{color:#D8D2E6; max-width:46ch; font-size:.95rem}
.wave{display:flex; align-items:flex-end; gap:5px; height:74px}
.wave i{display:block; width:6px; border-radius:3px; opacity:.9; animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
.login-form{display:flex; align-items:center; justify-content:center; padding:34px; background:var(--surface)}
.login-form .inner{width:min(400px,100%); display:flex; flex-direction:column; gap:14px}
.demo-accounts{display:grid; gap:8px}
.acct{
  display:flex; align-items:center; gap:11px; text-align:right; width:100%;
  border:1px solid var(--line); background:var(--surface-2); border-radius:var(--r-m); padding:10px 12px;
}
.acct:hover{border-color:var(--navy); background:var(--navy-soft)}
.acct .nm{font-weight:700; font-size:.9rem}
.acct .rl{font-size:.78rem; color:var(--ink-muted)}

/* ===== لوحة التحكم ===== */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); padding:16px}
.stat .k{font-size:.82rem; color:var(--ink-muted); font-weight:600; display:flex; align-items:center; gap:6px}
.stat .v{font-family:var(--display); font-size:2rem; font-weight:700; margin-top:6px; letter-spacing:-.5px}
.stat .u{font-size:.85rem; color:var(--ink-muted); font-weight:600}
.hero-new{
  background:linear-gradient(180deg,var(--navy) 0%, var(--navy-deep) 100%); color:#fff;
  border-radius:var(--r-l); padding:22px; display:flex; gap:18px; align-items:center; justify-content:space-between; flex-wrap:wrap;
  box-shadow:var(--shadow-m);
}
.hero-new h2{color:#fff}
.hero-new p{color:#DAD4EC; font-size:.9rem; margin-top:4px}
.hero-new .btn{background:#fff; color:var(--navy-deep); border:0; font-weight:700}

/* ===== الجداول ===== */
.tablewrap{overflow-x:auto; max-width:100%; border:1px solid var(--line); border-radius:var(--r-l); background:var(--surface)}
table{width:100%; border-collapse:collapse; font-size:.88rem; min-width:820px}
th,td{padding:11px 13px; text-align:right; border-bottom:1px solid var(--line); white-space:nowrap}
th{background:var(--surface-2); font-size:.78rem; color:var(--ink-muted); font-weight:700; position:sticky; top:0}
tbody tr:hover{background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}

/* ===== القوالب ===== */
.tpl-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px}
.tpl{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-l); padding:18px; display:flex; flex-direction:column; gap:10px}
.tpl.active{border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-soft)}
.tpl .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--navy-soft);color:var(--navy)}
:root[data-theme="dark"] .tpl .ic, :root:not([data-theme="light"]) .tpl .ic{color:var(--accent)}
.tpl p{font-size:.85rem;color:var(--ink-muted); min-height:44px}
.tplchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);
  background:var(--surface);border-radius:var(--r-pill);padding:8px 13px;font-size:.87rem;font-weight:600;color:var(--ink)}
.tplchip:hover{background:var(--surface-2)}
.tplchip.on{background:var(--navy);color:var(--btn-fg);border-color:transparent}
.tplchip.on .chip{background:rgba(255,255,255,.2);color:#fff}
.tplchip.soon{opacity:.72}
.stepno{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;
  background:var(--navy-soft);color:var(--navy);font-size:.75rem;font-weight:700;margin-inline-end:7px}
:root[data-theme="dark"] .stepno, :root:not([data-theme="light"]) .stepno{color:var(--accent)}
.pfgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.pfitem{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 12px}
.pfitem .k{font-size:.75rem;color:var(--ink-muted);font-weight:700}
.pfitem .v{font-weight:700;font-size:.92rem;margin-top:2px}

/* ===== التسجيل ===== */
.rec-layout{display:grid; grid-template-columns:1fr 320px; gap:18px; align-items:start}
.mic-stage{display:flex; flex-direction:column; align-items:center; gap:14px; padding:26px 18px}
.micbtn{
  width:132px;height:132px;border-radius:50%; border:0; color:#fff; background:var(--teal);
  display:grid; place-items:center; box-shadow:0 10px 30px color-mix(in srgb,var(--teal) 40%, transparent);
}
.micbtn.rec{background:var(--red); box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 55%, transparent); animation:ring 1.8s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 45%, transparent)}70%{box-shadow:0 0 0 26px transparent}100%{box-shadow:0 0 0 0 transparent}}
.timer{font-family:var(--display); font-size:2rem; font-weight:700; letter-spacing:1px}
.meter{display:flex; align-items:flex-end; gap:4px; height:46px}
.meter i{width:5px; border-radius:3px; background:var(--line-strong); height:8px; transition:height .12s ease, background .12s}
.meter.live i{background:var(--teal)}
.transcript{
  background:var(--surface-2); border:1px dashed var(--line-strong); border-radius:var(--r-m);
  padding:14px; min-height:150px; font-size:.95rem; line-height:2; white-space:pre-wrap;
}
.caret{display:inline-block;width:2px;height:1em;background:var(--teal);vertical-align:-2px;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.checklist{display:flex;flex-direction:column;gap:2px}
.ck{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r-s);font-size:.86rem;color:var(--ink-2)}
.ck.done{background:var(--teal-soft); color:var(--teal-ink); font-weight:600}
.ck .dot{width:17px;height:17px;border-radius:50%;border:2px solid var(--line-strong);flex:0 0 auto;display:grid;place-items:center}
.ck.done .dot{border-color:var(--teal); background:var(--teal); color:#fff}

/* ===== المعالجة ===== */
.steps{display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto}
.step{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);opacity:.5}
.step.on{opacity:1;border-color:var(--navy)}
.step.done{opacity:1}
.step .mark{width:26px;height:26px;border-radius:50%;background:var(--surface-3);color:var(--ink-muted);display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:0 0 auto}
.step.done .mark{background:var(--teal);color:#fff}
.step.on .mark{background:var(--navy);color:#fff}
.spin{width:18px;height:18px;border:2px solid var(--line-strong);border-top-color:var(--navy);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ===== المراجعة ===== */
.review{display:grid; grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr); gap:18px; align-items:start}
.pane-head{display:flex;align-items:center;gap:9px;padding:14px 18px;border-bottom:1px solid var(--line)}
.orig{padding:18px; font-size:.94rem; line-height:2.05; color:var(--ink-2)}
.orig mark{background:var(--teal-soft); color:var(--teal-ink); border-radius:4px; padding:0 2px}
.fields{display:flex;flex-direction:column}
.f{padding:14px 18px; border-bottom:1px solid var(--line)}
.f:last-child{border-bottom:0}
.f-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.f-name{font-weight:700;font-size:.9rem;font-family:var(--display)}
.f-val{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 11px;font-size:.9rem;line-height:1.75}
.f.st-complete{border-inline-start:0}
.f-val:focus{background:var(--surface); border-color:var(--accent)}
.f.st-missing .f-val{background:var(--red-soft); border-color:color-mix(in srgb,var(--red) 30%, transparent); color:var(--red)}
.f.st-review .f-val{background:var(--amber-soft); border-color:color-mix(in srgb,var(--amber) 30%, transparent)}
.conf{font-size:.72rem;font-weight:700;color:var(--ink-muted)}
.f-actions{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.mini{font-size:.76rem;padding:5px 10px;border-radius:var(--r-pill);border:1px solid var(--line-strong);background:var(--surface);font-weight:600}
.mini:hover{background:var(--surface-2)}
.mini.on{background:var(--navy);color:#fff;border-color:transparent}

/* ===== الاعتماد ===== */
.checkitem{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);font-size:.9rem}
.checkitem input{width:19px;height:19px;accent-color:var(--teal);margin-top:2px;flex:0 0 auto}
.summary{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:14px;max-height:44vh;overflow:auto;font-size:.88rem;line-height:1.9}
.summary dt{font-weight:700;color:var(--ink-2);font-family:var(--display);font-size:.85rem}
.summary dd{margin:0 0 9px;color:var(--ink)}

/* ===== النجاح ===== */
.success-wrap{max-width:620px;margin:20px auto;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.tick{width:82px;height:82px;border-radius:50%;background:var(--teal-soft);color:var(--teal-ink);display:grid;place-items:center}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;text-align:right;width:100%;font-size:.9rem}
.kv dt{color:var(--ink-muted);font-weight:600}
.kv dd{margin:0;font-weight:600}

/* ===== المؤشرات ===== */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}
.chart-tip{position:fixed;z-index:80;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-s);
  padding:7px 10px;font-size:.8rem;box-shadow:var(--shadow-m);pointer-events:none;opacity:0;transition:opacity .12s}
.chart-tip.on{opacity:1}
.bar-row{display:grid;grid-template-columns:150px 1fr 52px;align-items:center;gap:10px;font-size:.85rem;padding:5px 0}

function cut(s, stops){
  if(!s) return s;
  var out = s;
  for(var i=0;i<stops.length;i++){
    var p = out.indexOf(stops[i]);
    if(p > 0) out = out.slice(0,p);
  }
  return out.replace(/[\s،.]+$/,'').trim();
}
function m1(text, rx){ var m = text.match(rx); return m ? m[1].trim() : null; }

  function set(k, value, conf, note){

  }

  /* الشكوى الرئيسية */

    else {

      if(w && AR_NUM[w[1]]) parts.push('شدة الألم: ' + AR_NUM[w[1]] + '/10');

  if(med){
    var hasDose = /\d+\s*(?:ملغ|مجم|mg|جرعة)/.test(med);

    else set('meds', med + ' — الاسم والجرعة غير مذكورين', 'medium', 'يحتاج إلى استكمال اسم الدواء وجرعته');
  } else set('meds', null, null);

  /* الحساسية: التفريق بين النفي الصريح وعدم الذكر */
  if(/(لا\s+توجد\s+حساسية|ليس لديه حساسية|لا يوجد حساسية|بدون حساسية)/.test(t)){

  var hr = t.match(/النبض\s*[:،]?\s*(\d{2,3})/); if(hr) vals.push('النبض: '+hr[1]);
  var tp = t.match(/الحرارة\s*[:،]?\s*([\d.]{2,5})/); if(tp) vals.push('الحرارة: '+tp[1]);
  var sp = t.match(/التشبع\s*[:،]?\s*(\d{2,3})/); if(sp) vals.push('تشبع الأكسجين: '+sp[1]);
  if(vals.length) set('vitals', vals.join(' — '), 'high');
  else if(/العلامات الحيوية/.test(t)) set('vitals', 'تم قياس العلامات الحيوية — القيم غير مذكورة', 'medium', 'القيم الرقمية غير مذكورة في التسجيل');
  else set('vitals', null, null);

  /* التقييم السريري */
  var ex = [];
  if(/(واع|واعٍ|واعي)/.test(t) && /يستجيب/.test(t)) ex.push('مستوى الوعي: واعٍ ويستجيب');
  if(/تخطيط للقلب|تخطيط قلب|ECG|إيكو/.test(t)) ex.push('أُجري تخطيط للقلب — النتيجة غير مذكورة');
  set('exam', ex.length? ex.join(' — ') : null, ex.length && /النتيجة/.test(ex.join('')) ? 'medium':'high',
      ex.length && /النتيجة/.test(ex.join('')) ? 'نتيجة التخطيط غير مذكورة' : '');

  /* التدخلات */
  var iv = m1(t, /تم\s+([^.]+)/);
  if(iv){
    var list = iv.split(/\s+و(?=[أ-ي])/).map(function(x){ return x.replace(/^إجراء\s+/,'إجراء ').trim(); }).filter(Boolean);
    set('interv', list.join('، '), 'high');
  } else set('interv', null, null);

  /* الاستجابة */
  var resp = m1(t, /(ما زال[^.،]+|تحسن[^.،]*|لم يتحسن[^.،]*|استجاب[^.،]*)/);
  set('resp', resp ? resp.trim() : null, 'high');

  /* خطة المتابعة */
  var plan = m1(t, /(?:خطة المتابعة|سيتم|الخطة)\s*[:]?\s*([^.]+)/);
  set('plan', plan, 'high');

  /* الحالة لكل حقل */
  FIELDS.forEach(function(f){
    var o = F[f.key] || { value:NOT_STATED, conf:null, note:'' };
    if(o.value === NOT_STATED || o.value == null){
      o.status = f.req ? 'missing' : 'missing';
      o.value = NOT_STATED; o.conf = null;
    } else if(o.conf === 'medium' || String(o.value).indexOf(NOT_STATED) > -1){
      o.status = 'review';
    } else {
      o.status = 'complete';
    }
    o.edited = false;
    F[f.key] = o;
  });
  return F;
}

function missingList(fields){
  var out = [];
  FIELDS.forEach(function(f){
    var o = fields[f.key];
    if(!o) return;
    if(o.status === 'missing') out.push({ key:f.key, label:f.label, kind:'missing', req:f.req });
    else if(o.status === 'review') out.push({ key:f.key, label:f.label, kind:'review', req:f.req });
  });
  return out;
}

}

/* ---------- 12) شاشة المعلومات الناقصة ---------- */
function scMissing(){
  var d = S.draft; if(!d) return scDashboard();
  var items = missingList(d.fields);
  if(!items.length){
    return head('لا توجد معلومات ناقصة','جميع العناصر الأساسية وردت في التسجيل.','الاستكمال')+
      '<div class="card pad"><div class="notice teal">'+ic('check',16)+'<div>اكتملت العناصر المطلوبة في هذا القالب.</div></div>'+
      '<div class="row" style="margin-top:14px"><button class="btn primary" data-act="nav" data-k="review">'+ic('fwd',15)+'الانتقال إلى المراجعة</button></div></div>';
  }
  var rows = items.map(function(it){
    var o = d.fields[it.key];
    var isMissing = o.status === 'missing';
    return '<div class="card pad" style="margin-bottom:12px">'+
      '<div class="f-top">'+
        '<span class="f-name">'+esc(it.label)+'</span>'+ statusChip(o.status)+
        (it.req?'<span class="chip neutral">عنصر أساسي</span>':'')+
        (o.skipped?'<span class="chip warn">تم التخطي — يبقى غير مكتمل</span>':'')+
      '</div>'+
      '<div class="notice '+(isMissing?'red':'amber')+'" style="margin-bottom:10px">'+ic(isMissing?'warn':'alert',16)+
        '<div>'+ (isMissing
            ? 'لم يتم ذكر '+esc(it.label)+'. هل ترغب في استكمالها؟'
            : 'المعلومة الحالية: «'+esc(o.value)+'»'+(o.note?' — '+esc(o.note):'')+'. يُفضّل مراجعتها أو استكمالها.')+
        '</div></div>'+
      '<div class="row">'+
        '<button class="mini" data-act="fill-voice" data-k="'+it.key+'">'+ic('mic',13)+' إضافة بالصوت</button>'+
        '<button class="mini" data-act="fill-manual" data-k="'+it.key+'">'+ic('keyboard',13)+' إضافة يدويًا</button>'+
        '<button class="mini" data-act="fill-unknown" data-k="'+it.key+'">غير معروفة</button>'+
        '<button class="mini" data-act="fill-na" data-k="'+it.key+'">غير منطبقة</button>'+
        '<button class="mini" data-act="fill-skip" data-k="'+it.key+'">تخطي مؤقتًا</button>'+
      '</div>'+
      '<div id="fill-'+it.key+'" style="display:none;margin-top:10px">'+
        '<textarea rows="2" id="ftx-'+it.key+'" placeholder="اكتب ما ذُكر فعلًا فقط…"></textarea>'+
        '<div class="row" style="margin-top:8px">'+
          '<button class="btn primary" data-act="fill-save" data-k="'+it.key+'">'+ic('save',15)+'حفظ في الحقل</button>'+
          '<button class="btn" data-act="fill-cancel" data-k="'+it.key+'">إلغاء</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
  return head('استكمال المعلومات الناقصة', 'لا تُضيف المنصة أي معلومة لم تُذكر. ما لم يُذكر يبقى «غير مذكور» حتى تستكمله بنفسك.', 'الاستكمال')+
    rows +
    '<div class="row" style="margin-top:8px">'+
      '<button class="btn primary" data-act="nav" data-k="review">'+ic('fwd',15)+'متابعة إلى المراجعة</button>'+
      '<button class="btn" data-act="save-draft">'+ic('save',15)+'حفظ كمسودة</button>'+
    '</div>';
}

  var fieldsHtml = FIELDS.map(function(f){
    var o = d.fields[f.key];
    return '<div class="f st-'+o.status+'">'+
      '<div class="f-top">'+
        '<span class="f-name">'+esc(f.label)+'</span>'+
        (f.req?'<span class="chip neutral">أساسي</span>':'')+
        statusChip(o.status)+ confChip(o.conf)+
        (o.edited?'<span class="chip neutral">'+ic('edit',12)+' مُعدَّل</span>':'')+
      '</div>'+
      '<textarea class="f-val" rows="'+(String(o.value).length>70?3:2)+'" data-field="'+f.key+'" aria-label="'+esc(f.label)+'">'+esc(o.value)+'</textarea>'+
      (o.note?'<div class="hint" style="margin-top:5px">'+ic('alert',12)+' '+esc(o.note)+'</div>':'')+
      '<div class="f-actions">'+
        '<button class="mini" data-act="mark-ok" data-k="'+f.key+'">'+ic('check',12)+' اعتماد الحقل</button>'+

      '</div>'+
    '</div>';
  }).join('');

  return head('مراجعة الملاحظة السريرية','قارن النص الأصلي بالملاحظة المنظمة. جميع الحقول قابلة للتعديل، ولا شيء يُحفظ في ملف المريض قبل اعتمادك.','المراجعة')+

    '<span class="chip ok">'+ic('check',13)+'مكتملة: '+counts.complete+'</span>'+
    '<span class="chip warn">'+ic('alert',13)+'تحتاج إلى مراجعة: '+counts.review+'</span>'+

    '<button class="btn" data-act="save-draft">'+ic('save',15)+'حفظ كمسودة</button>'+
    '<button class="btn primary" data-act="nav" data-k="approve">'+ic('fwd',15)+'المراجعة النهائية والاعتماد</button>'+
  '</div>'+
  '<div class="review">'+
    '<section class="card">'+
      '<div class="pane-head">'+ic('wave',17)+'<h3>النص الأصلي المحوَّل من الصوت</h3></div>'+
      '<div class="orig">'+esc(d.transcript)+'</div>'+
      '<div style="padding:0 18px 16px"><div class="notice blue">'+ic('lock',15)+'<div>يُحفظ النص الأصلي كما هو للمقارنة، ولا يعدّله النظام.</div></div></div>'+
    '</section>'+

      '<div class="fields">'+fieldsHtml+'</div>'+

  var checks = CHECKS.map(function(c){
    return '<label class="checkitem"><input type="checkbox" data-check="'+c.k+'"'+(S.checks[c.k]?' checked':'')+'>'+
      '<span>'+esc(c.label)+(c.req?' <span class="chip neutral">مطلوب</span>':'')+'</span></label>';
  }).join('');

  '<div class="review">'+
    '<section class="card">'+

      '<div style="padding:16px"><div class="summary"><dl style="margin:0">'+dl+'</dl></div></div>'+

        '<button class="btn" data-act="nav" data-k="review">'+ic('back',15)+'العودة للتعديل</button>'+
        '<button class="btn" data-act="save-draft">'+ic('save',15)+'حفظ كمسودة</button>'+

/* ---------- 17) مؤشرات الأداء ---------- */
function areaChart(){
  var w=560,h=214,pl=58,pr=44,pt=18,pb=36;
  var vals=KPI.minutes, max=7, min=3.5;
  var iw=w-pl-pr, ih=h-pt-pb;
  var X=function(i){ return pl + iw*(i/(vals.length-1)); };
  var Y=function(v){ return pt + ih*(1-((v-min)/(max-min))); };
  var line='', area='M'+X(0)+' '+Y(vals[0]);
  vals.forEach(function(v,i){ var seg=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1); line+=seg; if(i) area+='L'+X(i).toFixed(1)+' '+Y(v).toFixed(1); });
  area += 'L'+X(vals.length-1).toFixed(1)+' '+(pt+ih)+'L'+X(0)+' '+(pt+ih)+'Z';
  var grid='', ticks=[4,5,6,7];
  ticks.forEach(function(t){
    grid += '<line x1="'+pl+'" y1="'+Y(t).toFixed(1)+'" x2="'+(w-pr)+'" y2="'+Y(t).toFixed(1)+'" style="stroke:var(--line)" stroke-width="1"/>'+
            '<text x="'+(w-pr+4)+'" y="'+(Y(t)+4).toFixed(1)+'" style="fill:var(--ink-muted);font-size:11px" text-anchor="start">'+t+'</text>';
  });
  var dots = vals.map(function(v,i){
    return '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="'+(i===vals.length-1?5.5:4)+'" style="fill:var(--teal);stroke:var(--surface)" stroke-width="2" '+
      'data-tip="'+esc(KPI.weeks[i]+': '+v+' دقيقة')+'"></circle>';
  }).join('');
  var xlabels = KPI.weeks.map(function(wk,i){
    return '<text x="'+X(i).toFixed(1)+'" y="'+(h-12)+'" style="fill:var(--ink-muted);font-size:10.5px" text-anchor="middle">'+esc(wk)+'</text>';
  }).join('');
  var last = vals[vals.length-1];
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="210" role="img" aria-label="متوسط زمن التوثيق التجريبي عبر ستة أسابيع">'+
    grid+
    '<path d="'+area+'" style="fill:var(--teal);opacity:.13"></path>'+
    '<path d="'+line+'" style="fill:none;stroke:var(--teal)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></path>'+
    dots+xlabels+
    '<text x="'+X(vals.length-1).toFixed(1)+'" y="'+(Y(last)-12).toFixed(1)+'" style="fill:var(--teal-ink);font-size:12px;font-weight:700" text-anchor="middle">'+last+' د</text>'+
  '</svg>';
}

      '<span class="bar-track"><span class="bar-fill" style="width:'+c.v+'%;background:'+col+'"></span></span>'+

  return 'N-' + (max+1);
}

  S.draft = {
    id: nextId(), pid: DEMO_PATIENT.id, tpl:(S.draft && S.draft.tpl) || 'ملاحظة قسم الطوارئ',
    roleLabel: (S.user ? S.user.role : 'طبيب'),
    author: S.user ? S.user.name : '—', date: nowDate(), time: nowTime(),
    status:'draft', dur:0, corrections:0, version:'1.0',
    transcript:'', fields:null, approvedAt:null
  };
  S.checks = {};
  S.rec = { on:false, paused:false, sec:0, i:0, text:'', timer:null, mode:S.rec.mode || 'sim' };
  save();
}

  var d = S.draft; if(!d) return;
  var row = { id:d.id, pid:d.pid, tpl:d.tpl, author:d.author, date:d.date, time:d.time,
    status:d.status, dur:d.dur, corrections:d.corrections };
  var i = -1;
  S.notes.forEach(function(n,idx){ if(n.id===d.id) i=idx; });
  if(i>-1) S.notes[i] = row; else S.notes.unshift(row);
  save();
}

/* ---------- 23) التسجيل ---------- */
var recTimer=null, wordTimer=null, meterTimer=null, recognition=null;
function stopTimers(){
  clearInterval(recTimer); clearInterval(wordTimer); clearInterval(meterTimer);
  recTimer = wordTimer = meterTimer = null;
  if(recognition){ try{ recognition.stop(); }catch(e){} recognition = null; }
}
function paintTranscript(){
  var el = $('transcript'); if(!el) return;
  el.innerHTML = S.rec.text ? esc(S.rec.text)+'<span class="caret"></span>'
    : '<span class="muted">سيظهر النص المحوَّل من الصوت هنا…</span>';
  var g = $('guide');
  if(g){
    g.innerHTML = GUIDE.map(function(x){
      var done = x.rx.test(S.rec.text||'');
      return '<div class="ck'+(done?' done':'')+'"><span class="dot">'+(done?ic('check',11,3):'')+'</span>'+esc(x.label)+'</div>';
    }).join('');
  }
}
function tickMeter(){
  var m = $('meter'); if(!m) return;
  var bars = m.querySelectorAll('i');
  for(var i=0;i<bars.length;i++){
    var h = S.rec.on && !S.rec.paused ? (8 + Math.round(Math.random()*36)) : 8;
    bars[i].style.height = h+'px';
  }
}
function startRec(){
  if(!S.draft) newDraft();
  S.rec.on = true; S.rec.paused = false;
  if(!S.rec.text){ S.rec.i = 0; }
  render();
  recTimer = setInterval(function(){
    if(S.rec.paused) return;
    S.rec.sec++; var t = $('timer'); if(t) t.textContent = mmss(S.rec.sec);
  }, 1000);
  meterTimer = setInterval(tickMeter, 140);

  if(S.rec.mode === 'live'){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ S.rec.mode='sim'; toast('ميكروفون المتصفح غير متاح هنا — تم التحويل إلى وضع المحاكاة'); }
    else {
      try{
        recognition = new SR();
        recognition.lang = 'ar-SA'; recognition.continuous = true; recognition.interimResults = true;
        var base = S.rec.text;
        recognition.onresult = function(ev){
          var out = '';
          for(var i=0;i<ev.results.length;i++){ out += ev.results[i][0].transcript; }
          S.rec.text = (base ? base+' ' : '') + out; paintTranscript();
        };
        recognition.onerror = function(){ toast('تعذّر استخدام الميكروفون — يمكنك الإدخال اليدوي أو وضع المحاكاة'); };
        recognition.start();
        return;
      }catch(e){ S.rec.mode='sim'; toast('تعذّر تشغيل الميكروفون — تم التحويل إلى وضع المحاكاة'); }
    }
  }
  var words = DEMO_TRANSCRIPT.split(' ');
  wordTimer = setInterval(function(){
    if(S.rec.paused) return;
    if(S.rec.i >= words.length){ clearInterval(wordTimer); wordTimer=null; return; }
    S.rec.text = (S.rec.text ? S.rec.text+' ' : '') + words[S.rec.i++];
    paintTranscript();
  }, 115);
}
function pauseRec(){
  S.rec.paused = !S.rec.paused;
  if(recognition){ try{ S.rec.paused ? recognition.stop() : recognition.start(); }catch(e){} }
  render();
  if(S.rec.on){ tickMeter(); }
  recTimer = recTimer || setInterval(function(){
    if(S.rec.paused) return;
    S.rec.sec++; var t=$('timer'); if(t) t.textContent = mmss(S.rec.sec);
  },1000);
}
function stopRec(){
  var txt = (S.rec.text||'').trim();
  stopTimers();
  S.rec.on = false; S.rec.paused = false;
  if(!txt){ toast('لا يوجد نص لتحليله — استخدم الإدخال اليدوي أو أعد التسجيل'); render(); return; }
  S.draft.transcript = txt;
  S.draft.dur = Math.max(S.rec.sec, 12);
  go('processing');
}

/* ---------- 24) المعالجة ---------- */
function runProcessing(){
  var i = 0;
  (function step(){
    if(i > 0){ var prev = $('pstep'+(i-1)); if(prev){ prev.classList.remove('on'); prev.classList.add('done'); prev.querySelector('.mark').innerHTML = ic('check',13,3); } }
    if(i >= PROC_STEPS.length){
      var d = S.draft;
      d.fields = extractFields(d.transcript);
      d.status = 'draft';
      upsertNoteRow();
      logAudit('إنشاء مسودة من تسجيل صوتي','—','—',d.id);
      var miss = missingList(d.fields);
      setTimeout(function(){ go(miss.length ? 'missing' : 'review'); }, 380);
      return;
    }
    var el = $('pstep'+i); if(el){ el.classList.add('on'); el.querySelector('.stat-ic').innerHTML = '<span class="spin"></span>'; }
    i++;
    setTimeout(step, 620);
  })();
}

/* ---------- 25) تعديل الحقول ---------- */
function statusOf(val){
  var v = String(val||'').trim();
  if(!v || v === NOT_STATED) return 'missing';
  if(v.indexOf(NOT_STATED) > -1 || v.indexOf('غير معروفة') > -1) return 'review';
  return 'complete';
}
function setField(key, value, opts){
  var d = S.draft; if(!d || !d.fields) return;
  var o = d.fields[key]; var before = o.value;
  o.value = value; o.status = (opts && opts.status) || statusOf(value);
  o.edited = true; o.conf = (opts && opts.conf) || 'user';
  if(opts && opts.note !== undefined) o.note = opts.note;
  o.skipped = !!(opts && opts.skipped);
  d.corrections++;
  logAudit((opts && opts.action) || 'تعديل حقل', labelOf(key), before, value);
  upsertNoteRow();
}
function labelOf(key){
  var l = key;
  FIELDS.forEach(function(f){ if(f.key===key) l = f.label; });
  return l;
}

/* ---------- 26) الاعتماد ---------- */
function syncApproveBtn(){

}

  d.approvedAt = nowDate() + ' ' + nowTime();

  upsertNoteRow();

}
function noteAsText(){
  var d = S.draft; if(!d) return '';
  var lines = ['وثّق | Wathiq — نسخة تجريبية (محاكاة فقط، لا ترتبط بأي نظام صحي)',
    'رقم الملاحظة: '+d.id, 'المريض التجريبي: '+d.pid+' — '+DEMO_PATIENT.age+' سنة — '+DEMO_PATIENT.sex,
    'القالب: '+d.tpl, 'الممارس: '+d.author, 'التاريخ: '+(d.approvedAt||d.date+' '+d.time), ''];
  FIELDS.forEach(function(f){ lines.push(f.label + ': ' + (d.fields? d.fields[f.key].value : NOT_STATED)); });
  lines.push('', 'النص الأصلي المحوَّل من الصوت:', d.transcript);
  return lines.join('\n');
}

];
function tourDone(){ try{ localStorage.setItem('wathiq_tour_done','1'); }catch(e){} }
function runTour(i, first){
  if(i >= TOUR.length){
    tourDone(); closeModal();
    if(first){ go('dashboard'); toast('يمكنك إعادة الجولة في أي وقت من صفحة المساعدة'); }

    body:'<p>'+esc(TOUR[i][1])+'</p>'+

      }).join('') +'</div>'+
      (i===0? '<div class="notice amber" style="margin-top:12px">'+ic('warn',15)+'<div>نسخة تجريبية للعرض فقط — بيانات افتراضية بالكامل ولا ترتبط بأي نظام صحي.</div></div>' : ''),

        if(vv && vv !== (u2[kk]||'')) { store[kk] = vv; logAudit('تعديل بيانات الملف الشخصي', kk, u2[kk]||'—', vv); }
      }
      try{ localStorage.setItem('wathiq_profile', JSON.stringify(S.profileEdits)); }catch(e){}
      S.profileEditing = false; render(); toast('تم حفظ بيانات الملف الشخصي');
      break;
    }
  }
});

/* الإدخال المباشر: تعديل الحقول، عوامل التصفية، قائمة التحقق */
document.addEventListener('input', function(ev){
  var el = ev.target;
  if(el.hasAttribute && el.hasAttribute('data-field')){
    var key = el.getAttribute('data-field');
    var o = S.draft && S.draft.fields && S.draft.fields[key];
    if(!o) return;
    o.value = el.value; o.status = statusOf(el.value); o.edited = true;
    var wrap = el.closest('.f');
    if(wrap){ wrap.className = 'f st-' + o.status; }
    return;
  }
  if(el.hasAttribute && el.hasAttribute('data-filter') && el.getAttribute('data-filter')==='q'){
    S.filters.q = el.value;
    var v = el.value, pos = el.selectionStart;
    render();
    var again = $('q'); if(again){ again.focus(); again.value = v; try{ again.setSelectionRange(pos,pos); }catch(e){} }
  }
});
document.addEventListener('change', function(ev){
  var el = ev.target;
  if(el.hasAttribute && el.hasAttribute('data-field')){
    var key = el.getAttribute('data-field');
    var o = S.draft.fields[key];
    S.draft.corrections++;
    logAudit('تعديل نص الحقل', labelOf(key), '—', el.value);
    upsertNoteRow();
    return;
  }
  if(el.hasAttribute && el.hasAttribute('data-filter')){
    var f = el.getAttribute('data-filter');
    if(f !== 'q'){ S.filters[f] = el.value; render(); }
    return;
  }
  if(el.hasAttribute && el.hasAttribute('data-check')){
    S.checks[el.getAttribute('data-check')] = el.checked;
    syncApproveBtn();
  }
});

/* تلميحات الرسوم */
document.addEventListener('mousemove', function(ev){
  var tip = $('ctip'); if(!tip) return;
  var t = ev.target.closest ? ev.target.closest('[data-tip]') : null;
  if(t){
    tip.textContent = t.getAttribute('data-tip');
    tip.style.insetInlineStart = 'auto';
    tip.style.left = Math.min(window.innerWidth-160, ev.clientX+12)+'px';
    tip.style.top = (ev.clientY-38)+'px';
    tip.classList.add('on');
  } else tip.classList.remove('on');
});

/* تحذير قبل مغادرة الصفحة مع مسودة غير محفوظة */
window.addEventListener('beforeunload', function(e){
  if(S.draft && S.draft.transcript && S.draft.status !== 'approved'){
    e.preventDefault(); e.returnValue = '';
  }
});
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeModal(); });

/* ---------- 29) الإقلاع ---------- */
function boot(){
  try{
    var th = localStorage.getItem('wathiq_theme');
    if(th) document.documentElement.setAttribute('data-theme', th);
  }catch(e){}
  load();
  try{ var pe = localStorage.getItem('wathiq_profile'); if(pe) S.profileEdits = JSON.parse(pe); }catch(e){}
  if(!S.notes || !S.notes.length) S.notes = SEED_NOTES.slice();
  render();
}
boot();

})();
</script>
